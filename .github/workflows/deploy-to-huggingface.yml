# Publishes the web app to a Hugging Face Space every time `main` changes.
# One-time setup: repo Settings -> Secrets and variables -> Actions -> New repository secret
#   HF_TOKEN = a Hugging Face access token with "write" permission
# To deploy to a different Space, change HF_SPACE below.
name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HF_SPACE: NamishMittal21/crop-yield-prediction

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Space folder
        run: |
          mkdir space
          cp -r app.py requirements.txt LICENSE data outputs space/
          cat .github/space_header.md README.md > space/README.md

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret is not set, so the Hugging Face deploy was skipped."
            exit 0
          fi
          pip install --quiet "huggingface_hub>=0.30"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(repo_id=space, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=space, repo_type="space",
                            commit_message="Deploy from GitHub")
          print(f"Deployed: https://huggingface.co/spaces/{space}")
          PY
